apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aks-devops-app-prod
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/devopsc91-collab/aks-devops-project.git
      targetRevision: main
      path: helm-chart
      helm:
        releaseName: aks-devops-app
        valueFiles:
          - $values/gitops/prod/values.yaml
    - repoURL: https://github.com/devopsc91-collab/aks-devops-project.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
