
trigger:
  - main

variables:
  - group: gitops-secrets

  - name: dockerRegistryServiceConnection
    value: acr-connection-fixed

  - name: azureSubscription
    value: azure-subscription-fixed

  - name: imageRepository
    value: aks-devops-app

  - name: containerRegistry
    value: pavandevopsacr12345.azurecr.io

  - name: dockerfilePath
    value: Dockerfile

  - name: tag
    value: $(Build.BuildId)

  - name: aksResourceGroup
    value: aks-devops-rg2

  - name: aksClusterName
    value: pavan-aks-cluster

stages:
  # 1. Build and push image to ACR
  - stage: Build
    displayName: Build and Push Image
    jobs:
      - job: BuildImage
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build and Push to ACR
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

  # 2. Scan image before deployment
  - stage: SecurityScan
    displayName: Trivy Security Scan
    dependsOn: Build
    jobs:
      - job: ScanImage
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - bash: |
              set -euo pipefail

              sudo apt-get update
              sudo apt-get install -y wget gnupg

              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
                | gpg --dearmor \
                | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
                | sudo tee /etc/apt/sources.list.d/trivy.list

              sudo apt-get update
              sudo apt-get install -y trivy

              IMAGE="$(containerRegistry)/$(imageRepository):$(tag)"
              docker pull "$IMAGE"

              trivy image \
                --exit-code 1 \
                --severity HIGH,CRITICAL \
                "$IMAGE"
            displayName: Scan Image with Trivy

  # 3. Update DEV GitOps values in GitHub
  - stage: UpdateGitOpsDev
    displayName: Update DEV GitOps Image
    dependsOn: SecurityScan
    jobs:
      - job: CommitDevImage
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail

              git config user.name "Azure Pipelines"
              git config user.email "azure-pipelines@users.noreply.github.com"

              git fetch origin main
              git checkout -B main origin/main

              sed -i -E \
                's/^  tag: .*/  tag: "$(tag)"/' \
                gitops/dev/values.yaml

              git add gitops/dev/values.yaml

              if git diff --cached --quiet; then
                echo "DEV image tag is already current."
                exit 0
              fi

              git commit -m "chore(gitops): deploy $(tag) to dev [skip ci]"

              AUTH="$(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"

              git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" \
                push origin HEAD:main
            displayName: Commit DEV Image Tag
            env:
              GH_PAT: $(GH_PAT)

  # 4. Enable DEV auto-sync and verify deployment
  - stage: ValidateDev
    displayName: Sync and Validate DEV
    dependsOn: UpdateGitOpsDev
    jobs:
      - job: WaitForDev
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Wait for Argo CD DEV Deployment
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials \
                  --resource-group "$(aksResourceGroup)" \
                  --name "$(aksClusterName)" \
                  --overwrite-existing

                kubectl patch application aks-devops-app-dev \
                  -n argocd \
                  --type merge \
                  -p '{"spec":{"syncPolicy":{"automated":{"prune":false,"selfHeal":true},"syncOptions":["CreateNamespace=true"]}}}'

                EXPECTED="$(containerRegistry)/$(imageRepository):$(tag)"
                DEPLOYMENT="aks-devops-app-helm-chart"

                echo "Waiting for DEV image: $EXPECTED"

                for i in $(seq 1 36); do
                  ACTUAL="$(kubectl get deployment "$DEPLOYMENT" -n dev \
                    -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"

                  if [ "$ACTUAL" = "$EXPECTED" ]; then
                    break
                  fi

                  echo "Current image: ${ACTUAL:-not available}; waiting..."
                  sleep 10
                done

                ACTUAL="$(kubectl get deployment "$DEPLOYMENT" -n dev \
                  -o jsonpath='{.spec.template.spec.containers[0].image}')"

                if [ "$ACTUAL" != "$EXPECTED" ]; then
                  echo "ERROR: DEV did not update to the expected image."
                  exit 1
                fi

                kubectl rollout status deployment/"$DEPLOYMENT" \
                  -n dev --timeout=5m

                for i in $(seq 1 36); do
                  SYNC="$(kubectl get application aks-devops-app-dev -n argocd \
                    -o jsonpath='{.status.sync.status}')"
                  HEALTH="$(kubectl get application aks-devops-app-dev -n argocd \
                    -o jsonpath='{.status.health.status}')"

                  if [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ]; then
                    echo "DEV Argo CD status: $SYNC / $HEALTH"
                    exit 0
                  fi

                  echo "Argo CD DEV status: $SYNC / $HEALTH; waiting..."
                  sleep 10
                done

                echo "ERROR: DEV Argo CD did not become Synced and Healthy."
                exit 1

  # 5. Promote the SAME tested image to PROD.
  # Configure an approval check on the Azure DevOps "prod" environment.
  - stage: PromoteGitOpsProd
    displayName: Promote Tested Image to PROD
    dependsOn: ValidateDev
    condition: succeeded()
    jobs:
      - deployment: PromoteImage
        displayName: Approve and Update PROD GitOps
        environment: prod
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - bash: |
                    set -euo pipefail

                    git config user.name "Azure Pipelines"
                    git config user.email "azure-pipelines@users.noreply.github.com"

                    git fetch origin main
                    git checkout -B main origin/main

                    sed -i -E \
                      's/^  tag: .*/  tag: "$(tag)"/' \
                      gitops/prod/values.yaml

                    git add gitops/prod/values.yaml

                    if git diff --cached --quiet; then
                      echo "PROD image tag is already current."
                      exit 0
                    fi

                    git commit -m "chore(gitops): promote $(tag) to prod [skip ci]"

                    AUTH="$(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"

                    git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" \
                      push origin HEAD:main
                  displayName: Commit PROD Image Tag
                  env:
                    GH_PAT: $(GH_PAT)

  # 6. Enable PROD auto-sync and verify deployment
  - stage: ValidateProd
    displayName: Sync and Validate PROD
    dependsOn: PromoteGitOpsProd
    condition: succeeded()
    jobs:
      - job: WaitForProd
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Wait for Argo CD PROD Deployment
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials \
                  --resource-group "$(aksResourceGroup)" \
                  --name "$(aksClusterName)" \
                  --overwrite-existing

                kubectl patch application aks-devops-app-prod \
                  -n argocd \
                  --type merge \
                  -p '{"spec":{"syncPolicy":{"automated":{"prune":false,"selfHeal":true},"syncOptions":["CreateNamespace=true"]}}}'

                EXPECTED="$(containerRegistry)/$(imageRepository):$(tag)"
                DEPLOYMENT="aks-devops-app-helm-chart"

                echo "Waiting for PROD image: $EXPECTED"

                for i in $(seq 1 36); do
                  ACTUAL="$(kubectl get deployment "$DEPLOYMENT" -n prod \
                    -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"

                  if [ "$ACTUAL" = "$EXPECTED" ]; then
                    break
                  fi

                  echo "Current image: ${ACTUAL:-not available}; waiting..."
                  sleep 10
                done

                ACTUAL="$(kubectl get deployment "$DEPLOYMENT" -n prod \
                  -o jsonpath='{.spec.template.spec.containers[0].image}')"

                if [ "$ACTUAL" != "$EXPECTED" ]; then
                  echo "ERROR: PROD did not update to the expected image."
                  exit 1
                fi

                kubectl rollout status deployment/"$DEPLOYMENT" \
                  -n prod --timeout=5m

                for i in $(seq 1 36); do
                  SYNC="$(kubectl get application aks-devops-app-prod -n argocd \
                    -o jsonpath='{.status.sync.status}')"
                  HEALTH="$(kubectl get application aks-devops-app-prod -n argocd \
                    -o jsonpath='{.status.health.status}')"

                  if [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ]; then
                    echo "PROD Argo CD status: $SYNC / $HEALTH"
                    exit 0
                  fi

                  echo "Argo CD PROD status: $SYNC / $HEALTH; waiting..."
                  sleep 10
                done

                echo "ERROR: PROD Argo CD did not become Synced and Healthy."
                exit 1

